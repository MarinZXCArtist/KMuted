name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build exe
        run: python tools/build_exe.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build installer
        run: python tools/build_installer.py --no-exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KMuted-Setup
          path: dist/KMuted-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: KMuted-portable
          path: dist/KMuted
          if-no-files-found: error

      # A new version number in kmuted/__init__.py on the default branch
      # publishes a release by itself; the app updates from it in one click.
      - name: Version and release notes
        id: ver
        shell: bash
        run: |
          version=$(python -c "from kmuted import __version__; print(__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python tools/release_notes.py "$version" > dist/release-notes.md

      - name: Is this version released yet?
        id: rel
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || steps.rel.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: KMuted ${{ steps.ver.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/KMuted-Setup-*.exe
            dist/*.zip
